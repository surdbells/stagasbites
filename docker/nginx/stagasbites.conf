# Reference nginx rules for the API vhost (api.stagasbites.ca) on aaPanel.
# aaPanel generates the server block itself. Set the site's "Running directory" to
# /apps/api/public and paste ONLY the location blocks below into
# Website > api.stagasbites.ca > URL rewrite.

# Every request that is not a real file (uploads are) goes to the Slim front controller.
location / {
    try_files $uri /index.php$is_args$args;
}

# Uploaded product photos: long cache, never executed.
location ^~ /uploads/ {
    expires 30d;
    add_header Cache-Control "public";
    location ~ \.php$ { return 403; }
}

# Never serve dotfiles such as .env or .user.ini.
location ~ /\.(?!well-known) {
    deny all;
}
