# Production vhost. Static Angular files are served directly; every other storefront
# URL goes to PHP so the HTML arrives with per-page SEO tags already in it (no SSR needed).
server {
    listen 80;
    server_name stagasbites.ca www.stagasbites.ca;

    set $web_root /www/wwwroot/stagasbites/apps/web/dist/web/browser;
    set $api_root /www/wwwroot/stagasbites/apps/api/public;

    client_max_body_size 6m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build assets: cache forever.
    location ~* \.(?:js|css|woff2|jpg|jpeg|png|webp|avif|svg|ico|webmanifest)$ {
        root $web_root;
        try_files $uri @uploads;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @uploads {
        root $api_root;
        try_files $uri =404;
    }

    # API, sitemap, robots and the SEO-aware SPA shell all run through Slim.
    location / {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_param SCRIPT_FILENAME $api_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
