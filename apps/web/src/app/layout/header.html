<header class="header" [class.header--solid]="scrolled() || menuOpen()">
  <div class="container header__inner">
    <a routerLink="/" class="brand" (click)="closeMenu()" aria-label="Staga's Bites home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
          <path d="M16 3c1 5-5 7-5 13a5 5 0 0 0 10 0c0-2-1-3-1-5 3 2 6 6 6 10a10 10 0 0 1-20 0C6 12 14 10 16 3Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand__text">Staga's <em>Bites</em></span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen()" aria-label="Primary">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a class="nav__mobile-only" [routerLink]="auth.isLoggedIn() ? '/account' : '/account/login'" (click)="closeMenu()">
        {{ auth.isLoggedIn() ? 'My account' : 'Sign in' }}
      </a>
    </nav>

    <div class="header__actions">
      <a class="icon-btn header__account" [routerLink]="auth.isLoggedIn() ? '/account' : '/account/login'"
         [attr.aria-label]="auth.isLoggedIn() ? 'My account' : 'Sign in'">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </a>
      <a class="icon-btn header__wish" routerLink="/wishlist" [attr.aria-label]="'Favourites, ' + wishlist.count() + ' saved'">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.400-7-10a4 4 0 0 1 7-2.600A4 4 0 0 1 19 10c0 5.600-7 10-7 10Z"/></svg>
        @if (wishlist.count() > 0) {
          <span class="badge">{{ wishlist.count() }}</span>
        }
      </a>
      <button type="button" class="icon-btn" (click)="cart.drawerOpen.set(true)"
              [attr.aria-label]="'Open cart, ' + cart.count() + ' items'">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>
        </svg>
        @if (cart.count() > 0) {
          <span class="badge">{{ cart.count() }}</span>
        }
      </button>
      <a routerLink="/menu" class="btn btn--sm header__cta">Order now</a>
      <button type="button" class="icon-btn burger" (click)="menuOpen.set(!menuOpen())"
              [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>
